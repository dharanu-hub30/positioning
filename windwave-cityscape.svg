<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7fb5"/><stop offset="1" stop-color="#bfe0ee"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7fa3"/><stop offset="1" stop-color="#17566f"/>
    </linearGradient>
    <g id="turbine">
      <rect x="-2" y="0" width="4" height="70" fill="#f4f8fa"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="7s" repeatCount="indefinite"/>
        <path d="M0 0 L-3 -38 Q0 -42 3 -38 Z" fill="#fff"/>
        <path d="M0 0 L33 19 Q32 24 28 22 Z" fill="#fff"/>
        <path d="M0 0 L-33 19 Q-32 24 -28 22 Z" fill="#fff"/>
        <circle r="4" fill="#dfe9ee"/>
      </g>
    </g>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <ellipse cx="170" cy="70" rx="70" ry="14" fill="#fff" opacity=".55"/>
  <ellipse cx="610" cy="110" rx="90" ry="16" fill="#fff" opacity=".45"/>
  <rect y="300" width="800" height="100" fill="url(#sea)"/>
  <!-- city skyline -->
  <g fill="#2b4a5a">
    <rect x="250" y="215" width="40" height="90"/><rect x="295" y="185" width="34" height="120"/>
    <rect x="335" y="230" width="46" height="75"/><rect x="388" y="165" width="38" height="140"/>
    <rect x="432" y="205" width="42" height="100"/><rect x="480" y="240" width="50" height="65"/>
    <rect x="536" y="195" width="34" height="110"/>
  </g>
  <g fill="#f2c94c" opacity=".85">
    <rect x="258" y="228" width="6" height="8"/><rect x="272" y="244" width="6" height="8"/>
    <rect x="303" y="200" width="6" height="8"/><rect x="315" y="224" width="6" height="8"/>
    <rect x="397" y="182" width="6" height="8"/><rect x="408" y="208" width="6" height="8"/>
    <rect x="440" y="222" width="6" height="8"/><rect x="545" y="212" width="6" height="8"/>
  </g>
  <!-- hills -->
  <path d="M0 305 L0 250 Q90 200 190 255 Q230 275 260 305 Z" fill="#4e7a62"/>
  <path d="M560 305 Q640 235 740 270 Q780 285 800 300 L800 305 Z" fill="#4e7a62"/>
  <!-- turbines -->
  <g transform="translate(110 200)"><use href="#turbine"/></g>
  <g transform="translate(660 215) scale(.85)"><use href="#turbine"/></g>
  <g transform="translate(730 235) scale(.65)"><use href="#turbine"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
